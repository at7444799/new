name: Auto Post AI Influencer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to post?"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - photo
          - reel
      force:
        description: "Force post outside IST time?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    - cron: "30 1 * * *"     # 7:00 AM IST photo
    - cron: "0 5 * * *"      # 10:30 AM IST reel
    - cron: "0 8 * * *"      # 1:30 PM IST reel
    - cron: "30 11 * * *"    # 5:00 PM IST reel
    - cron: "0 14 * * *"     # 7:30 PM IST photo

permissions:
  contents: write

concurrency:
  group: auto-post-ai-influencer
  cancel-in-progress: false

jobs:
  auto-post:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Kolkata

      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}

      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
      NVIDIA_VISION_MODEL: ${{ secrets.NVIDIA_VISION_MODEL }}

      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}

      FORCE_POST: ${{ github.event.inputs.force || 'false' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Decide mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "30 1 * * *") MODE="photo" ;;
              "0 5 * * *") MODE="reel" ;;
              "0 8 * * *") MODE="reel" ;;
              "30 11 * * *") MODE="reel" ;;
              "0 14 * * *") MODE="photo" ;;
              *) MODE="auto" ;;
            esac
          fi

          echo "MANUAL_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Selected mode: $MODE"

      - name: Show time
        run: |
          echo "UTC time:"
          date -u
          echo "India time:"
          TZ=Asia/Kolkata date

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Create folders
        run: |
          mkdir -p media/incoming
          mkdir -p media/music

      - name: Create and publish instantly
        run: npm run auto-post

      - name: Commit deleted used media
        if: always()
        run: |
          git config user.name "ai-influencer-bot"
          git config user.email "actions@github.com"

          git add -A media

          if git diff --cached --quiet; then
            echo "No media cleanup changes"
          else
            git commit -m "Delete uploaded media"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
