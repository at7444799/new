name: AI Influencer Content Manager

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What should the manager post?"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning_photo
          - afternoon_photo
          - evening_photo
          - night_photo
          - reel
          - story

  schedule:
    # GitHub Actions cron is UTC. India time = UTC + 5:30.
    # Real human style cycle for India time.
    - cron: "30 1 * * *"   # 7:00 AM IST - morning post
    - cron: "0 5 * * *"    # 10:30 AM IST - reel / travel recap
    - cron: "0 8 * * *"    # 1:30 PM IST - afternoon post
    - cron: "30 11 * * *"  # 5:00 PM IST - reel / golden hour
    - cron: "0 14 * * *"   # 7:30 PM IST - evening post
    - cron: "30 16 * * *"  # 10:00 PM IST - night reel/story

permissions:
  contents: write

concurrency:
  group: ai-influencer-content-manager
  cancel-in-progress: false

jobs:
  auto-post:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Kolkata

      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}

      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
      NVIDIA_VISION_MODEL: ${{ secrets.NVIDIA_VISION_MODEL }}

      # Optional. Use a JSON manifest like: {"images":["https://.../1.jpg","https://.../2.jpg"]}
      CLOUD_IMAGE_MANIFEST_URL: ${{ secrets.CLOUD_IMAGE_MANIFEST_URL }}

      # delete = remove used photos after successful posting. move = move them to media/photos/used.
      POST_USE_ACTION: delete

      # Optional future hook. Keep none until you add a real image-to-video provider adapter.
      VIDEO_GENERATION_PROVIDER: none
      VIDEO_GENERATION_API_KEY: ${{ secrets.VIDEO_GENERATION_API_KEY }}

      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Decide manager mode
        shell: bash
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "Triggered schedule: ${{ github.event.schedule }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "30 1 * * *") MODE="morning_photo" ;;
              "0 5 * * *") MODE="reel" ;;
              "0 8 * * *") MODE="afternoon_photo" ;;
              "30 11 * * *") MODE="reel" ;;
              "0 14 * * *") MODE="evening_photo" ;;
              "30 16 * * *") MODE="night_photo" ;;
              *) MODE="auto" ;;
            esac
          fi

          echo "MANUAL_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Selected mode: $MODE"

      - name: Show trigger and time
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Selected mode: $MANUAL_MODE"
          echo "Branch: $GITHUB_REF_NAME"
          echo "UTC time:" && date -u
          echo "India time:" && TZ=Asia/Kolkata date

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Create AI manager folders
        run: |
          mkdir -p media/photos/incoming media/photos/used media/photos/rejected media/photos/planned
          mkdir -p media/morning media/evening media/reels media/videos media/music
          mkdir -p media/_ig_ready media/_reels media/_cloud_cache data
          test -f data/posted_history.json || echo '{"posted":[],"used_music":[]}' > data/posted_history.json
          test -f data/pending_post.json || echo '{}' > data/pending_post.json
          echo "Current media files:"
          find media -maxdepth 4 -type f | sort || true

      - name: Prepare managed content
        run: npm run auto-post:prepare

      - name: Commit prepared media for public raw URLs
        run: |
          git config user.name "ai-influencer-manager"
          git config user.email "actions@github.com"
          git add -A media data
          if git diff --cached --quiet; then
            echo "No prepared content changes to commit"
          else
            git commit -m "Prepare managed influencer content"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Wait for GitHub raw media availability
        run: sleep 45

      - name: Publish managed content
        run: npm run auto-post:publish

      - name: Commit cleanup and history
        if: always()
        run: |
          git config user.name "ai-influencer-manager"
          git config user.email "actions@github.com"
          git add -A media data
          if git diff --cached --quiet; then
            echo "No cleanup/history changes to commit"
          else
            git commit -m "Update influencer content history"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
