name: Auto Post AI Influencer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to post?"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - morning_photo
          - evening_photo
          - reel

  schedule:
    # GitHub Actions cron always runs in UTC.
    # India time = UTC + 5:30

    # 7:00 AM IST - Morning photo
    - cron: "30 1 * * *"

    # 10:30 AM IST - Reel 1
    - cron: "0 5 * * *"

    # 1:30 PM IST - Reel 2
    - cron: "0 8 * * *"

    # 5:00 PM IST - Reel 3
    - cron: "30 11 * * *"

    # 7:30 PM IST - Evening photo
    - cron: "0 14 * * *"

    # 10:00 PM IST - Reel 4
    - cron: "30 16 * * *"

permissions:
  contents: write

concurrency:
  group: auto-post-ai-influencer
  cancel-in-progress: false

jobs:
  auto-post:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Kolkata

      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}

      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
      NVIDIA_VISION_MODEL: ${{ secrets.NVIDIA_VISION_MODEL }}

      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Decide post mode
        shell: bash
        run: |
          echo "GitHub event: ${{ github.event_name }}"
          echo "Triggered schedule: ${{ github.event.schedule }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "30 1 * * *")
                MODE="morning_photo"
                ;;
              "0 5 * * *")
                MODE="reel"
                ;;
              "0 8 * * *")
                MODE="reel"
                ;;
              "30 11 * * *")
                MODE="reel"
                ;;
              "0 14 * * *")
                MODE="evening_photo"
                ;;
              "30 16 * * *")
                MODE="reel"
                ;;
              *)
                MODE="auto"
                ;;
            esac
          fi

          echo "MANUAL_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Selected post mode: $MODE"

      - name: Show trigger and time
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Selected mode: $MANUAL_MODE"
          echo "Branch: $GITHUB_REF_NAME"

          echo "UTC time:"
          date -u

          echo "India time:"
          TZ=Asia/Kolkata date

      - name: Safety check India time
        shell: bash
        run: |
          HOUR=$(TZ=Asia/Kolkata date +%H)
          MIN=$(TZ=Asia/Kolkata date +%M)

          echo "Current India time: $HOUR:$MIN"
          echo "Mode: $MANUAL_MODE"

          # This does NOT block the workflow.
          # It only prints warning if GitHub delayed the run.
          if [ "$MANUAL_MODE" = "morning_photo" ]; then
            echo "Expected slot: Morning photo around 7:00 AM IST"
          elif [ "$MANUAL_MODE" = "evening_photo" ]; then
            echo "Expected slot: Evening photo around 7:30 PM IST"
          elif [ "$MANUAL_MODE" = "reel" ]; then
            echo "Expected slot: Reel schedule"
          else
            echo "Expected slot: Auto/manual"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Check and create required folders
        run: |
          mkdir -p media/reels
          mkdir -p media/morning
          mkdir -p media/evening
          mkdir -p media/music
          mkdir -p media/videos
          mkdir -p media/weekend
          mkdir -p media/posted
          mkdir -p data

          echo "Media folder structure:"
          find media -maxdepth 3 -type f | sort || true

          echo "Reels files:"
          ls -la media/reels || true

          echo "Morning files:"
          ls -la media/morning || true

          echo "Evening files:"
          ls -la media/evening || true

          echo "Music files:"
          ls -la media/music || true

      - name: Prepare content
        run: npm run auto-post:prepare

      - name: Commit prepared content
        run: |
          git config user.name "ai-influencer-bot"
          git config user.email "actions@github.com"

          git status
          git add -A media data

          if git diff --cached --quiet; then
            echo "No prepared content changes to commit"
          else
            git commit -m "Prepare influencer content"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Wait for GitHub raw files
        run: sleep 35

      - name: Publish content
        run: npm run auto-post:publish

      - name: Commit cleanup and history
        if: always()
        run: |
          git config user.name "ai-influencer-bot"
          git config user.email "actions@github.com"

          git status
          git add -A media data

          if git diff --cached --quiet; then
            echo "No cleanup/history changes to commit"
          else
            git commit -m "Clean posted media and update history"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
