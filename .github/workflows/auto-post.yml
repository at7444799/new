name: Auto Post AI Influencer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "What to post?"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - photo
          - reel
      force:
        description: "Force post outside IST time window?"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

  schedule:
    # GitHub cron time is UTC.
    # IST = UTC + 5:30

    # 7:00 AM IST photo
    - cron: "30 1 * * *"

    # 10:30 AM IST reel
    - cron: "0 5 * * *"

    # 1:30 PM IST reel
    - cron: "0 8 * * *"

    # 5:00 PM IST reel
    - cron: "30 11 * * *"

    # 7:30 PM IST photo
    - cron: "0 14 * * *"

permissions:
  contents: write

concurrency:
  group: auto-post-ai-influencer
  cancel-in-progress: false

jobs:
  auto-post:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Kolkata

      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}

      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
      NVIDIA_VISION_MODEL: ${{ secrets.NVIDIA_VISION_MODEL }}

      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.ref_name }}

      FORCE_POST: ${{ github.event.inputs.force || 'false' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Decide mode
        shell: bash
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Schedule: ${{ github.event.schedule }}"
          echo "Manual mode: ${{ github.event.inputs.mode }}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            case "${{ github.event.schedule }}" in
              "30 1 * * *")
                MODE="photo"
                ;;
              "0 5 * * *")
                MODE="reel"
                ;;
              "0 8 * * *")
                MODE="reel"
                ;;
              "30 11 * * *")
                MODE="reel"
                ;;
              "0 14 * * *")
                MODE="photo"
                ;;
              *)
                MODE="auto"
                ;;
            esac
          fi

          echo "MANUAL_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Selected mode: $MODE"

      - name: Show time
        run: |
          echo "UTC time:"
          date -u
          echo "India time:"
          TZ=Asia/Kolkata date
          echo "Mode: $MANUAL_MODE"
          echo "Force post: $FORCE_POST"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Create simple folders
        run: |
          mkdir -p media/photos
          mkdir -p media/reels
          mkdir -p media/music
          mkdir -p data/generated

          echo "Photos:"
          find media/photos -maxdepth 2 -type f | sort || true

          echo "Reels:"
          find media/reels -maxdepth 3 -type f | sort || true

          echo "Music:"
          find media/music -maxdepth 1 -type f | sort || true

      - name: Prepare content
        run: npm run auto-post:prepare

      - name: Commit prepared content
        run: |
          git config user.name "ai-influencer-bot"
          git config user.email "actions@github.com"

          git add -A media data

          if git diff --cached --quiet; then
            echo "No prepared content changes"
          else
            git commit -m "Prepare post content"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi

      - name: Wait for raw GitHub file
        run: sleep 35

      - name: Publish content
        run: npm run auto-post:publish

      - name: Commit cleanup/history
        if: always()
        run: |
          git config user.name "ai-influencer-bot"
          git config user.email "actions@github.com"

          git add -A media data

          if git diff --cached --quiet; then
            echo "No cleanup/history changes"
          else
            git commit -m "Update posted history and cleanup"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
